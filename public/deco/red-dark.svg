<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none"> <style> * { transform-box: fill-box; } .march { stroke-dasharray: 5 7; animation: march 2.4s linear infinite; } @keyframes march { to { stroke-dashoffset: -24; } } .glow { animation: glow 4.8s ease-in-out infinite; } @keyframes glow { 0%,100% { opacity: .35; } 45%,60% { opacity: .75; } } .leaf { transform-origin: 0% 50%; animation: leaf 4.8s cubic-bezier(.6,0,.3,1) infinite; } @keyframes leaf { 0%,8%,92%,100% { transform: scaleX(1); } 40%,62% { transform: scaleX(.12); } } .rise { animation: rise 4.8s ease-out infinite; opacity: 0; } @keyframes rise { 0%,30% { transform: translate(0,0); opacity: 0; } 40% { opacity: 1; } 100% { transform: translate(var(--dx,0px), -110px); opacity: 0; } } .dot { animation: twinkle 3.2s ease-in-out infinite; } @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.35); } } .dot { transform-origin: center; } .spin { transform-origin: center; animation: spin 6s ease-in-out infinite; } @keyframes spin { 0%,100% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.35); } } .draw { stroke-dasharray: 130; animation: draw 5s ease-in-out infinite; } @keyframes draw { 0% { stroke-dashoffset: 130; } 45%,55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -130; } } .orbit { transform-box: view-box; transform-origin: 270px 40px; animation: orbit 7s linear infinite; } .orbit2 { transform-box: view-box; transform-origin: 70px 250px; animation: orbit 16s linear infinite; } @keyframes orbit { to { transform: rotate(360deg); } } .pulse { transform-origin: center; animation: pulse 2.8s ease-out infinite; } @keyframes pulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } } .zig { animation: zig 3.6s ease-in-out infinite; } @keyframes zig { 0%,100% { transform: translateX(0); } 50% { transform: translateX(14px); } } .bob { animation: bob 4s ease-in-out infinite; } @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(-4deg); } } .flow { stroke-dasharray: 3 9; animation: flow 1.6s linear infinite; } @keyframes flow { to { stroke-dashoffset: -24; } } .node { transform-origin: center; animation: node 2.4s ease-in-out infinite; } @keyframes node { 0%,100% { transform: scale(1); } 50% { transform: scale(1.5); } } .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } } .wave { animation: wave 2.4s ease-in-out infinite; opacity: .15; } @keyframes wave { 0%,100% { opacity: .15; } 30%,60% { opacity: 1; } } .slow { transform-origin: center; animation: orbit 22s linear infinite; } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rise { opacity: 0; } } </style> <circle class="slow" cx="70" cy="250" r="46" stroke="rgba(244,241,234,.10)" stroke-width="1.5" stroke-dasharray="2 8"/> <g class="orbit2"><circle cx="70" cy="204" r="3" fill="rgba(240,96,52,.75)"/></g> <circle cx="70" cy="262" r="4" fill="rgba(240,96,52,.75)"/> <path class="wave" style="animation-delay:0.0s" d="M50 248.0a10 10 0 0 1 20 0" stroke="rgba(240,96,52,.75)" stroke-width="2" stroke-linecap="round" transform="rotate(0)"/><path class="wave" style="animation-delay:0.3s" d="M40 246.0a20 20 0 0 1 40 0" stroke="rgba(244,241,234,.20)" stroke-width="2" stroke-linecap="round" transform="rotate(0)"/><path class="wave" style="animation-delay:0.6s" d="M30 244.0a30 30 0 0 1 60 0" stroke="rgba(244,241,234,.20)" stroke-width="2" stroke-linecap="round" transform="rotate(0)"/> <line class="flow" x1="200" y1="90" x2="280" y2="140" stroke="rgba(240,96,52,.75)" stroke-width="1.5" style="animation-delay:0.0s"/><line class="flow" x1="280" y1="140" x2="230" y2="210" stroke="rgba(244,241,234,.20)" stroke-width="1.5" style="animation-delay:-0.3s"/><line class="flow" x1="230" y1="210" x2="290" y2="260" stroke="rgba(240,96,52,.75)" stroke-width="1.5" style="ani