<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none"> <style> * { transform-box: fill-box; } .march { stroke-dasharray: 5 7; animation: march 2.4s linear infinite; } @keyframes march { to { stroke-dashoffset: -24; } } .glow { animation: glow 4.8s ease-in-out infinite; } @keyframes glow { 0%,100% { opacity: .35; } 45%,60% { opacity: .75; } } .leaf { transform-origin: 0% 50%; animation: leaf 4.8s cubic-bezier(.6,0,.3,1) infinite; } @keyframes leaf { 0%,8%,92%,100% { transform: scaleX(1); } 40%,62% { transform: scaleX(.12); } } .rise { animation: rise 4.8s ease-out infinite; opacity: 0; } @keyframes rise { 0%,30% { transform: translate(0,0); opacity: 0; } 40% { opacity: 1; } 100% { transform: translate(var(--dx,0px), -110px); opacity: 0; } } .dot { animation: twinkle 3.2s ease-in-out infinite; } @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.35); } } .dot { transform-origin: center; } .spin { transform-origin: center; animation: spin 6s ease-in-out infinite; } @keyframes spin { 0%,100% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.35); } } .draw { stroke-dasharray: 130; animation: draw 5s ease-in-out infinite; } @keyframes draw { 0% { stroke-dashoffset: 130; } 45%,55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -130; } } .orbit { transform-box: view-box; transform-origin: 270px 40px; animation: orbit 7s linear infinite; } .orbit2 { transform-box: view-box; transform-origin: 70px 250px; animation: orbit 16s linear infinite; } @keyframes orbit { to { transform: rotate(360deg); } } .pulse { transform-origin: center; animation: pulse 2.8s ease-out infinite; } @keyframes pulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } } .zig { animation: zig 3.6s ease-in-out infinite; } @keyframes zig { 0%,100% { transform: translateX(0); } 50% { transform: translateX(14px); } } .bob { animation: bob 4s ease-in-out infinite; } @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(-4deg); } } .flow { stroke-dasharray: 3 9; animation: flow 1.6s linear infinite; } @keyframes flow { to { stroke-dashoffset: -24; } } .node { transform-origin: center; animation: node 2.4s ease-in-out infinite; } @keyframes node { 0%,100% { transform: scale(1); } 50% { transform: scale(1.5); } } .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } } .wave { animation: wave 2.4s ease-in-out infinite; opacity: .15; } @keyframes wave { 0%,100% { opacity: .15; } 30%,60% { opacity: 1; } } .slow { transform-origin: center; animation: orbit 22s linear infinite; } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rise { opacity: 0; } } </style> <defs><radialGradient id="g" cx="50%" cy="70%" r="70%"><stop offset="0" stop-color="#e2471c" stop-opacity=".95"/><stop offset="1" stop-color="#e2471c" stop-opacity="0"/></radialGradient></defs> <circle class="glow" cx="230" cy="270" r="70" fill="url(#g)" opacity=".5"/> <path class="march" d="M150 300V170c0-52 36-84 80-100 44 16 80 48 80 100v130" stroke="rgba(244,241,234,.20)" stroke-width="1.5"/> <path d="M205 300v-62c0-16 11-28 25-34 14 6 25 18 25 34v62z" fill="rgba(240,96,52,.75)"/> <path class="leaf" d="M205 300v-62c0-16 11-28 25-34 14 6 25 18 25 34v62z" fill="#16130f" stroke="rgba(240,96,52,.75)" stroke-width="2"/> <path d="M205 300h50" stroke="rgba(240,96,52,.75)" stroke-width="2"/> <circle class="rise" cx="222" cy="236" r="2.2" fill="rgba(240,96,52,.75)" style="--dx:-18px;animation-delay:0s"/><circle class="rise" cx="234" cy="236" r="1.6" fill="rgba(240,96,52,.75)" style="--dx:14px;animation-delay:0.5s"/><circle class="rise" cx="240" cy="236" r="2" fill="rgba(240,96,52,.75)" style="--dx:26px;animation-delay:1.1s"/><circle class="rise" cx="228" cy="236" r="1.4" fill="rgba(240,96,52,.75)" style="--dx:-6px;animation-delay:1.6s"/><circle cla