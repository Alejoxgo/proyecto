<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250" width="480" height="500" class="cza" role="img" aria-label="Cástor saludando"><style>
.cza *{transform-box:view-box}
.cza-sube{transform-origin:120px 248px;animation:cza-sube .9s cubic-bezier(.34,1.56,.64,1) both}
.cza-cuerpo{transform-origin:120px 246px;animation:cza-respira 3.4s ease-in-out .9s infinite}
.cza-cabeza{transform-origin:120px 150px;animation:cza-cabeza-entra .9s ease-out both,cza-cabeza 7s ease-in-out .9s infinite}
.cza-cola{transform-origin:78px 236px;animation:cza-cola 2.6s ease-in-out infinite}
.cza-pata{transform-origin:156px 184px;animation:cza-saluda 2.2s ease-in-out .5s infinite}
.cza-ondas{opacity:0;animation:cza-ondas 2.2s ease-in-out .5s infinite}
.cza-ojos{transform-origin:120px 88px;animation:cza-parpadea 5.2s linear 1.4s infinite}
.cza-oreja{transform-origin:72px 64px;animation:cza-oreja 9s ease-in-out 3s infinite}
.cza-luz{animation:cza-luz 2.2s ease-in-out infinite}
.cza-mejillas{opacity:.5;animation:cza-mejillas 2.2s ease-in-out .5s infinite}
@keyframes cza-sube{0%{transform:translateY(70px) scale(.7);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes cza-respira{50%{transform:scale(1.025,1.035)}}
@keyframes cza-cabeza-entra{0%{transform:rotate(-10deg)}70%{transform:rotate(5deg)}100%{transform:none}}
@keyframes cza-cabeza{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg) translateY(-1px)}60%{transform:rotate(2.5deg)}}
@keyframes cza-cola{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes cza-saluda{0%,34%,100%{transform:rotate(0)}5%,15%{transform:rotate(-22deg)}10%,20%{transform:rotate(10deg)}25%{transform:rotate(-18deg)}30%{transform:rotate(4deg)}}
@keyframes cza-ondas{0%,32%,100%{opacity:0}5%,27%{opacity:.75}}
@keyframes cza-parpadea{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
@keyframes cza-oreja{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-14deg)}96%{transform:rotate(4deg)}}
@keyframes cza-luz{50%{fill:#9fd0ff}}
@keyframes cza-mejillas{0%,34%,100%{opacity:.5}12%,24%{opacity:.85}}
</style>
